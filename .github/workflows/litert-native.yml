  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up dependencies
        run: brew install gperf cmake coreutils

      - name: Patch LiteRT (macOS)
        run: |
          FILE="core/native/LiteRT/litert/vendors/samsung/ai_litecore_manager.cc"
          if [ -f "$FILE" ]; then
            echo "Patching $FILE to fix missing constants on macOS"
            # Prepend definitions to the file
            printf '#define kLibSuffix ".dylib"\n#define kRelativePath ""\n' > "$FILE.tmp"
            cat "$FILE" >> "$FILE.tmp"
            mv "$FILE.tmp" "$FILE"
          fi

      - name: Build LiteRT (macOS)
        run: |
          cmake -S core/native/LiteRT/litert -B build-release \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_BUILD_TYPE=Release \
                -DLITERT_AUTO_BUILD_TFLITE=OFF \
                -DLITERT_ENABLE_GPU=OFF \
                -DLITERT_ENABLE_NPU=OFF \
                -DLITERT_ENABLE_VENDORS=OFF \
                -DLITERT_BUILD_EXAMPLES=OFF \
                -DLITERT_BUILD_TESTS=OFF \
                -DLITERT_DISABLE_KLEIDIAI=ON
          cmake --build build-release -j 4

      - name: Prepare Artifacts
        run: |
          DEST="core/generated/litert/mac/x64"
          mkdir -p "$DEST/lib"
          mkdir -p "$DEST/include"
          find build-release -name "*.dylib" -exec cp {} "$DEST/lib/" \;
          cp -r core/native/LiteRT/litert/c/*.h "$DEST/include/"

      - name: Force add artifacts
        run: git add -f core/generated/litert/mac/x64

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: LiteRT for macOS x64
          add: core
