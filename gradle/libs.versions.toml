[versions]
agp = "8.13.0"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.10.1"
composeMultiplatform = "1.8.1"
tflite = "2.17.0"
kotlin = "2.2.21"
vanniktech-publish = "0.32.0"
groupId = "io.github.shadmanadman"
artifactId = "kflite"
snapshotVersion = "1.53.0-SNAPSHOT"
iosDeploymentTarget = "16.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

# tflite for Android
tfliteGpuApi = { module = "org.tensorflow:tensorflow-lite-gpu-api", version.ref = "tflite" }
tflite = { module = "org.tensorflow:tensorflow-lite", version.ref = "tflite" }
tfliteGPU = { module = "org.tensorflow:tensorflow-lite-gpu", version.ref = "tflite" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinCocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }
vanniktechPublish = {id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish"}