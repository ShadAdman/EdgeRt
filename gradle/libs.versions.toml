[versions]
agp = "8.13.0"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.10.1"
composeMultiplatform = "1.8.1"
tflite = "2.17.0"
litert = "2.1.5"
litert-support = "1.4.2"
pytorch = "2.1.0"
executorch = "1.3.1"
kotlin = "2.2.21"
vanniktech-publish = "0.32.0"
groupId = "io.github.shadadman"
artifactId = "kflite"
snapshotVersion = "1.73.0-SNAPSHOT"
iosDeploymentTarget = "16.0"
startup = "1.2.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "startup" }

# tflite for Android
tfliteGpuApi = { module = "org.tensorflow:tensorflow-lite-gpu-api", version.ref = "tflite" }
tflite = { module = "org.tensorflow:tensorflow-lite", version.ref = "tflite" }
tfliteGPU = { module = "org.tensorflow:tensorflow-lite-gpu", version.ref = "tflite" }

# litert for Android
litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
litert-gpu = { module = "com.google.ai.edge.litert:litert-gpu", version.ref = "litert-support" }
pytorch = { module = "org.pytorch:pytorch_android", version.ref = "pytorch" }
executorch = { module = "org.pytorch:executorch-android", version.ref = "executorch" }
#litert-api = { module = "com.google.ai.edge.litert:litert-api", version.ref = "litert-support" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinCocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }
vanniktechPublish = {id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish"}